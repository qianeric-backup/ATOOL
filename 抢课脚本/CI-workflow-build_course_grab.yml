# ======================================================================
# GitHub Actions CI：抢课助手 Windows exe + Linux 二进制 双平台打包
# ======================================================================
# 生效方法（本文件为交付副本，需放到仓库根才可被 Actions 识别）：
#   cp CI-workflow-build_course_grab.yml ../.github/workflows/build_course_grab.yml
#   （在仓库根执行 git add / commit / push 后，Actions 页面即出现双平台构建）
# 触发：push 到 main 且改动 抢课脚本/** ｜ 推 v* tag ｜ 手动 workflow_dispatch
# 产物：
#   - Artifact（每次构建）: grab_course-exe-windows / grab_course-bin-linux
#   - Release（仅 v* tag） : grab_course_<tag>.exe + grab_course_linux_<tag>
# ======================================================================
name: Build 抢课助手 (Windows exe + Linux bin)

on:
  push:
    branches: [ main ]
    paths:
      - "抢课脚本/**"
      - ".github/workflows/build_course_grab.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 抢课脚本
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: Syntax check
        shell: pwsh
        run: python -m py_compile app.py gench_login.py gench_session.py

      - name: Build exe (PyInstaller, console=False)
        shell: pwsh
        run: pyinstaller "抢课助手.spec" --clean --noconfirm

      - name: Rename exe to release asset name
        shell: pwsh
        run: |
          $asset = "grab_course_${{ github.ref_name }}.exe"
          Copy-Item "dist/抢课助手.exe" "$asset" -Force
          Get-Item "$asset" | Select-Object Name, Length

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: grab_course-exe-windows
          path: 抢课脚本/grab_course_*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 抢课脚本
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: Syntax check
        run: python -m py_compile app.py gench_login.py gench_session.py

      - name: Build Linux binary (PyInstaller, console=True)
        run: pyinstaller "抢课助手.spec" --clean --noconfirm

      - name: Rename to release asset name
        run: |
          asset="grab_course_linux_${{ github.ref_name }}"
          cp "dist/抢课助手" "$asset"
          chmod +x "$asset"
          ls -lh "$asset"

      - name: Smoke test (CLI --help)
        run: |
          chmod +x "dist/抢课助手"
          "./dist/抢课助手" --cli --help | head -5

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: grab_course-bin-linux
          path: 抢课脚本/grab_course_linux_*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: grab_course-*
          merge-multiple: true
          path: assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 抢课助手 ${{ github.ref_name }}
          files: assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
